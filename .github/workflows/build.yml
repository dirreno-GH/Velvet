name: Build VelvetVault 2.1

on:
  push:
    branches:
      - main
    paths:
      - 'VelvetVault_2.1.cs'
      - 'VelvetVault.csproj'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Create Velvet app icon
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("VelvetVault.ico", [Convert]::FromBase64String(""))

      - name: Restore
        run: msbuild VelvetVault.csproj /t:Restore /p:Configuration=Release /p:Platform="Any CPU"

      - name: Build Windows EXE
        run: msbuild VelvetVault.csproj /p:Configuration=Release /p:Platform="Any CPU" /p:RestorePackages=false

      - name: Prepare artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path bin -Filter "VelvetVault-2.1.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "VelvetVault-2.1.exe was not produced." }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $exe.FullName "artifact\VelvetVault-2.1.exe"

      - name: Copy release files to repository root
        shell: pwsh
        run: |
          Copy-Item "artifact\VelvetVault-2.1.exe" "VelvetVault-2.1.exe" -Force

      - name: Commit built EXE and icon
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VelvetVault-2.1.exe VelvetVault.ico
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Build VelvetVault 2.1"
            git push
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VelvetVault-2.1
          path: artifact/VelvetVault-2.1.exe
          if-no-files-found: error
